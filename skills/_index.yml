cross_cutting_rules:
- Base URL is tenant- and country-scoped — https://{tenant}.buk.cl/api/v1/{country}.
- Three different auth headers across three hosts — auth_token, token, and x-provider-name plus
  x-provider-token.
- The contracts declare securityDefinitions but do not apply security, so generated clients do
  not send the header.
- Pagination is page / page_size with a pagination object in the response.
- There is no idempotency mechanism anywhere — every write skill must re-read before retrying.
- No 429 is documented and no rate-limit headers exist; throttle conservatively.
- Errors carry no machine-readable code and mix Spanish and English; branch on HTTP status.
- Webhooks are notification-only, unsigned, with no documented retry or ordering guarantee.
