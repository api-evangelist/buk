source: https://www.buk.cl/ + https://demo.buk.cl/ + https://trust.buk.cl/ + https://app.ctrlit.cl/ + https://zktc.prod.asis.buk.cl/
summary: >-
  Buk publishes no /.well-known/ discovery surface on any of its own hosts — no
  security.txt, no api-catalog, no OIDC/OAuth metadata, no ai-plugin.json and no
  A2A agent card. The only /.well-known/ documents that answer 200 anywhere in the
  Buk namespace belong to trust.buk.cl, which is a hosted SafeBase (by Drata) trust
  center: its OIDC / OAuth metadata describes SafeBase's own platform MCP
  authorization server at app.safebase.io, not a Buk API surface. Recorded here for
  completeness and explicitly NOT credited to Buk as an authorization server.
hosts:
- host: https://www.buk.cl
  role: Marketing site (Chile)
  documents:
  - {path: /.well-known/security.txt, status: 404}
  - {path: /.well-known/openid-configuration, status: 404}
  - {path: /.well-known/oauth-authorization-server, status: 404}
  - {path: /.well-known/oauth-protected-resource, status: 404}
  - {path: /.well-known/api-catalog, status: 404}
  - {path: /.well-known/ai-plugin.json, status: 404}
  - {path: /.well-known/agent-card.json, status: 404}
  - {path: /.well-known/agent.json, status: 404}
