  detail: >-
    No deprecation policy, notice period, sunset schedule or deprecation header is published
    anywhere on the Buk surface, and no operation in any of the seven harvested contracts is
    marked deprecated. Nothing tells an integrator how much warning they would get before an
    endpoint or a field changes.
