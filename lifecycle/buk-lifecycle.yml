  - {url: 'https://buk.statuspage.io/', status: 200, note: 'Atlassian Statuspage returns its
      generic "inactive" page — the subdomain is registered but no status page is published there.'}
  detail: >-
    Buk publishes no status page, no uptime history and no incident feed for the platform or
    the API. There is no SLA document on the public site either. For a payroll system of record
    whose customers must run a legally-timed monthly settlement cycle, this is the single
    largest operational-transparency gap on the profile.
