authentication:
  style: API key in a custom header
  header: auth_token
  issuance: Generated by a tenant administrator inside the Buk platform under Configuración > Acceso
    API > Crear nueva API Key
  scoping: Tokens are scoped per entity with two permission levels — Lectura, and Lectura y Modificación.
    Every operation description in the contract names the entity permission it requires.
  notes: The Swagger 2.0 contracts declare securityDefinitions.auth_token but do NOT apply a global
    or per-operation security block, so a generated client will not attach the header automatically.
