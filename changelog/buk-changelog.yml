api_changelog:
  exists: false
  detail: >-
    Buk publishes NO API-specific changelog, release notes or version history. The Data Access
    contract carries no info.version, the Swagger 2.0 documents are regenerated per tenant with
    no dated revision marker, and neither the /apidocs page nor the support-center integration
    articles record when an endpoint was added, changed or removed. The only version signal an
    integrator has is GET /versions, which reports what the tenant is currently running rather
    than what changed. Breaking changes to the API would therefore reach integrators
    unannounced. The entries below are PRODUCT release notes, not API release notes, and are
    recorded as the nearest published equivalent.
