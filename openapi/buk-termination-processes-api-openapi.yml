        - Sociedad Emisora de Tarjetas Los Heroes S.A.
        - Tenpo Prepago SA
        - Global 66
        - Mercadopago Emisora S.A.
        - Los Andes Tarjetas de Prepago
        - JP Morgan Chase Bank
