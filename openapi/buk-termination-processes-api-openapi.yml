  FiniquitoBase:
    properties:
      fecha:
        type: string
        format: date
      fecha_aviso:
        type: string
        format: date
      fecha_pago:
        type: string
        format: date
      razon:
        type: string
      anos_de_servicio:
        type: number
      indemnizacion_legal_por_anos_servicios:
        type: number
      indemnizacion_legal_por_meses_obra:
        type: number
      indemnizacion_sustitutiva_previo_aviso:
        type: number
      indemnizacion_pactada_contractualmente:
        type: number
      indemnizacion_voluntaria:
        type: number
      indemnizacion_vacaciones:
        type: number
      descuento_seguro_cesantia:
        type: number
      otros_descuentos:
        type: number
      monto_indemnizacion_no_renta:
        type: number
      reajuste_indemnizacion:
        type: number
      interes_indemnizacion:
        type: number
      en_liquidacion:
        type: boolean
      custom_attributes:
        type: object
  FiniquitoInputCountry:
    allOf:
    - $ref: '#/definitions/FiniquitoBase_2'
    required:
    - en_liquidacion
    - fecha_pago
    properties:
      template_documento_id:
        type: number
      documento_visible:
        type: boolean
      descuentos:
        type: array
        items:
          $ref: '#/definitions/AsignacionFiniquito'
      haberes:
        type: array
        items:
          $ref: '#/definitions/AsignacionFiniquito'
securityDefinitions:
  auth_token:
    type: apiKey
    name: auth_token
    in: header
