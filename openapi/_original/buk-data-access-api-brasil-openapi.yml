  /items:
    get:
      summary: Listar ítems
      description: "Retorna todos los ítems registrados en el sistema\n\nSe cada ítem se compone de\n\
        \ - id: identificador único del ítem\n - name: nombre descriptivo\n - amount: es la cantidad a\
        \ asignar del ítem, este puede ser vacío\n - income_tax: si es o no tributable\n - created_at:\
        \ fecha de creación\n - updated_at: última fecha de actualización\n - type: [descuento, haber,\
        \ aporte, informativo]\n - start_date: fecha de inicio\n - end_date: fecha de fin\n - calculation_method:\
        \ [fijo, proporcional, proporcional ausencia, porcentaje sueldo base, líquido, formulado]\n -\
        \ base_extra_hours: afecta el cálculo de base de las horas extra\n - currency: tipo de moneda\
        \ referida\n - gratification: afecta el cálculo de base de las horas extra\n - base_seventh_work_day:\
        \ afecta el cálculo de base de las horas extra\n - advance_payment_day: si es o no anticipo\n\
        \ - uf_day: dia de la UF\n - taxable: si es o no tributable\n - base_contribution_license: afecta\
        \ el cálculo de base de las horas extra\n - amount_type: [unico, variable, formulado]\n - formula:\
        \ formula para el caso de ítem formulado\n - blocked: para no ser modificado\n - group_ine: código\
        \ para encuesta coyuntural\n - affects_overdraft: si afecta o no el sobregiro\n - remuneration_type:\
        \ tipo de remuneración para el finiquito\n - previous_bono_id: ítem anterior, en caso de haber\
        \ terminado uno y comenzando otro nuevo\n - editable: si es o no editable\n - limit_areas: si\
        \ está o no limitado por areas\n - order_section: para ítems acumulativos, sección de la liquidación\
        \ se va a calcular el acumulador\n - order_number:  para ítems acumulativos, orden se va a calcular\
        \ el concepto dentro de la liquidación\n - requestable: solicitable en el flujo de solicitud de\
        \ ítem\n - assignable: si es o no asignable a un empleado\n - after_section: para ítems acumulativos,\
        \ si ocurrirá después de dicha sección\n - code: codigo identificador\n - agrupacion_lre: agrupación\
        \ para libro de remuneraciones electrónico\n\n\n**Permisos requeridos para utilizar este endpoint:**\
        \ \n* Permisos de ítems en: 'Lectura' o 'Lectura y Modificación'.\n\n"
