swagger: '2.0'
securityDefinitions:
  auth_token:
    type: apiKey
    name: auth_token
    in: header
info:
  description: '# Buk Data Access API.


    To use the API, you need to obtain an **API Key**.

    You can manage access within the platform, in **Settings => API Access.**


    Once an API Key is created, you must send the value as a header in the HTTP request, in the `auth_token`
    field.


    ## For more details, you can review the article "How to integrate with Buk through an API"


    # Endpoints

    '
tags:
- name: Períodos
- name: Procesos
- name: Empleados
- name: Trabajos
- name: Liquidaciones
- name: Boletas de Pago
- name: Vacaciones
- name: Feriados
- name: Beneficios
- name: Personas
- name: Ausencias
- name: Inasistencias
- name: Licencias
- name: Permisos
- name: Horas no trabajadas
- name: Horas Extras
- name: Cargos
- name: Áreas
- name: Empresas
- name: Centralización contable
- name: Estructuras contables
- name: Ítems
- name: KPIs
- name: Suspensiones laborales
- name: Centro de costo
- name: Localidades
- name: Sindicatos
- name: Labores
- name: Tarifas
- name: Productos
- name: Unidades
- name: Lugares de Trabajo
- name: Registros de Trabajo
- name: Créditos
- name: Días trabajados
- name: Recintos
- name: Evaluaciones
- name: Suplencias
- name: Sincronización datos de pago
- name: Versiones
host: demo.buk.cl
basePath: /api/v1/brasil
consumes:
- application/json
produces:
- application/json
- application/pdf
paths:
  /recruiting/applicants:
    post:
      summary: Add applicant
      description: "Create a new applicant.\n\nFor parameters with values in square brackets, choose 1.\
        \ e.g. document_type\n\n**Permisos requeridos para utilizar este endpoint:** \n* Selection permissions\
        \ en: 'Lectura y Modificación'.\n"
      tags:
      - Postulante
      parameters:
      - name: Applicant
        in: body
        description: Applicant parameters
        required: true
        schema:
          title: RequestBody
          properties:
            applicant:
              $ref: '#/definitions/ApplicantInput'
      responses:
        '201':
          description: Applicant created.
          schema:
            title: ResponseBody
            properties:
              applicant:
                $ref: '#/definitions/Applicant'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /recruiting/applicants/search_by_email:
    post:
      summary: Display Applicant
      description: "Return the applicant by their ID or RUT.\n\n**Permisos requeridos para utilizar este\
        \ endpoint:** \n* Selection permissions en: 'Lectura' o 'Lectura y Modificación'.\n"
      tags:
      - Postulante
      parameters:
      - name: email
        in: body
        description: Applicant email
        required: true
        schema:
          title: RequestBody
          properties:
            applicant:
              $ref: '#/definitions/SearchApplicantByEmail'
      responses:
        '200':
          description: Answer with the data of the queried applicant
          schema:
            title: ResponseBody
            properties:
              applicant:
                $ref: '#/definitions/Applicant'
        '404':
          description: Applicant not found
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /recruiting/applicants/{id}:
    get:
      summary: Display Applicant
      description: "Return the applicant by their ID or RUT.\n\n**Permisos requeridos para utilizar este\
        \ endpoint:** \n* Selection permissions en: 'Lectura' o 'Lectura y Modificación'.\n"
      tags:
      - Postulante
      parameters:
      - name: id
        in: path
        description: ID or RUT of the applicant being queried. RUT number must be provided without dots
          and can include or exclude the dash character.
        required: true
        type: string
      responses:
        '200':
          description: Answer with the data of the queried applicant
          schema:
            title: ResponseBody
            properties:
              applicant:
                $ref: '#/definitions/Applicant'
        '404':
          description: Applicant not found
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
    patch:
      summary: Update applicants.
      description: "Update an applicant\n\n**Permisos requeridos para utilizar este endpoint:** \n* Selection\
        \ permissions en: 'Lectura y Modificación'.\n\n"
      tags:
      - Applicant
      parameters:
      - name: id
        in: path
        type: string
        description: ID of the applicant being updated.
        required: true
        items:
          type: integer
      - name: postulante
        in: body
        description: Applicant parameters.
        required: true
        schema:
          $ref: '#/definitions/ApplicantInput'
      responses:
        '200':
          description: Applicant information updated.
          schema:
            title: ResponseBody
            properties:
              applicant:
                $ref: '#/definitions/Applicant'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
        '404':
          description: The requested resource does not exist
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
  /recruiting/applicants/:
    get:
      summary: Create Applicants
      description: "Return the list of applicants\n\n**Permisos requeridos para utilizar este endpoint:**\
        \ \n* Selection permissions en: 'Lectura' o 'Lectura y Modificación'.\n"
      tags:
      - Postulante
      parameters:
      - name: selection_processes[]
        in: query
        type: array
        description: (Optional) IDs of the selection processes to be queried. (Returns applicants if they
          are at least in one selection process)
        collectionFormat: multi
        items:
          type: integer
      - name: page_size
        in: query
        type: integer
        description: (Optional) Number of responses per page. By default, it has a value of 25 and must
          be within a range of [25 - 100]
      - name: page
        in: query
        type: integer
        description: (OPTIONAL) Page number
      responses:
        '200':
          description: Response with the list of queried applicants
          schema:
            title: ResponseBody
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              applicants:
                type: array
                items:
                  $ref: '#/definitions/Applicant'
        '404':
          description: 'The requested resource does not exist  '
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /recruiting/applicants/{id}/applications:
    get:
      summary: List applications by applicant
      description: "Return all applications associated with the applicant, using their ID or RUT number.\n\
        \n**Permisos requeridos para utilizar este endpoint:** \n* Selection permissions en: 'Lectura'\
        \ o 'Lectura y Modificación'.\n"
      tags:
      - Postulante
      parameters:
      - name: id
        in: path
        required: true
        type: string
        description: ID or RUT of the applicant being queried. RUT number must be provided without dots
          and can include or exclude the dash character.
      - name: page_size
        in: query
        type: integer
        description: (Optional) Number of responses per page. By default, it has a value of 25 and must
          be within a range of [25 - 100]
      responses:
        '200':
          description: As a response, an array (applications) is received with the information of the
            applications submitted by the queried applicant.
          schema:
            title: ResponseBody
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              applications:
                type: array
                items:
                  $ref: '#/definitions/ApplicationForApplicant'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /recruiting/applications:
    post:
      summary: Add applications
      description: "Create an application\n\n**Permisos requeridos para utilizar este endpoint:** \n*\
        \ Selection permissions en: 'Lectura y Modificación'.\n\n"
      tags:
      - Application
      parameters:
      - name: application
        in: body
        description: Parameters of an application
        required: true
        schema:
          title: RequestBody
          required:
          - application
          properties:
            application:
              $ref: '#/definitions/ApplicationInput'
      responses:
        '201':
          schema:
            title: ResponseBody
            properties:
              application:
                $ref: '#/definitions/Application'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
        '404':
          description: The requested resource does not exist
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
    get:
      summary: List the applications.
      description: "Display application\n\n**Permisos requeridos para utilizar este endpoint:** \n* Selection\
        \ permissions en: 'Lectura y Modificación'.\n\n"
      tags:
      - Application
      parameters:
      - name: selection_processes[]
        in: query
        type: array
        description: (Optional) IDs of the selection processes to be queried. (Returns applications if
          they are in at least one selection process)
        collectionFormat: multi
        items:
          type: integer
      - name: application_date
        in: query
        type: string
        format: date
        description: (OPTIONAL) Indicate the date of application to be consulted (Format YYYYY-MM-DD)
      - name: updated_from
        in: query
        type: string
        format: date
        description: (OPCIONAL) Indica la fecha inicial de actualización a consultar (Formato YYYY-MM-DD)
      - name: updated_to
        in: query
        type: string
        format: date
        description: (OPCIONAL) Indica la fecha final de actualización a consultar (Formato YYYY-MM-DD)
      - name: page_size
        in: query
        type: integer
        description: (Optional) Number of responses per page. By default, it has a value of 25 and must
          be within a range of [25 - 100].
      - name: page
        in: query
        type: integer
        description: Page number
      responses:
        '200':
          description: A list of applications that meet the search criteria.
          schema:
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              data:
                type: array
                items:
                  $ref: '#/definitions/Application'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /recruiting/applications/{id}:
    patch:
      summary: Update applications
      description: "Update application\n\n**Permisos requeridos para utilizar este endpoint:** \n* Selection\
        \ permissions en: 'Lectura y Modificación'.\n\n"
      tags:
      - Application
      parameters:
      - name: id
        in: path
        type: string
        description: ID of the application to be updated
        required: true
        items:
          type: integer
      - name: postulacion
        in: body
        description: Parameters of an application
        required: true
        schema:
          $ref: '#/definitions/ApplicationInput'
      responses:
        '200':
          description: Information of the updated application.
          schema:
            title: ResponseBody
            properties:
              application:
                $ref: '#/definitions/Application'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
        '404':
          description: The requested resource does not exist
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
  /recruiting/selection_processes:
    get:
      summary: 'List selection processes '
      description: "It displays all selection processes in the system\n\n**Permisos requeridos para utilizar\
        \ este endpoint:** \n* Selection permissions en: 'Lectura' o 'Lectura y Modificación'.\n"
      tags:
      - Selection process
      parameters:
      - name: page_size
        in: query
        type: integer
        description: (OPTIONAL) Number of answers per page. By default, it has a value of 25 and must
          be within a range of [25 - 100].
      - name: page
        in: query
        type: integer
        description: (OPTIONAL) Page number
      - name: from
        in: query
        type: string
        format: date
        description: (OPTIONAL) Search for selection processes starting from this date. If not specified,
          selection processes from the beginning are used. Format YYYY-MM-DD
      - name: to
        in: query
        type: string
        format: date
        description: (OPTIONAL) Search for selection processes up to this date. If not specified, selection
          processes up to the current date are used. Format YYYY-MM-DD
      responses:
        '200':
          description: As a response we receive an array (selection_processes) with the information of
            the selection processes
          schema:
            title: ResponseBody
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              data:
                type: array
                items:
                  $ref: '#/definitions/SelectionProcess'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
    post:
      summary: Selection Process
      description: "Creates a new selection process based on the parameters provided. If a template_id\
        \ is not specified, the default template is used.\n\n**Permisos requeridos para utilizar este\
        \ endpoint:** \n* Selection permissions en: 'Lectura y Modificación'.\n"
      tags:
      - Selection process
      parameters:
      - name: selection_process
        in: body
        description: Parameters of a selection process
        required: true
        schema:
          title: RequestBody
          required:
          - selection_process
          properties:
            selection_process:
              $ref: '#/definitions/SelectionProcessInput'
      responses:
        '201':
          description: API response to the creation of a selection process.
          schema:
            title: ResponseBody
            properties:
              selection_process:
                $ref: '#/definitions/SelectionProcess'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /talent/evaluation_processes:
    get:
      summary: Show performance evaluations
      description: "Provides the data of the available performance evaluations.\nEach performance evaluation\
        \ has the following attributes:\n- id: Unique Id of the performance evaluation\n- name: name of\
        \ performance evaluation\n- participants: number of participants added to performance evaluation\n\
        - status: performance evaluation status\n- start_date: performance evaluation start date\n- end_date:\
        \ performance evaluation end date\n- global_progress: percentage of completed forms \n- stages:\
        \ stages set for performance evaluation\n\n**Permisos requeridos para utilizar este endpoint:**\
        \ \n* Evaluation permissions en: 'Lectura'.\n"
      tags:
      - Evaluations
      parameters:
      - name: page_size
        in: query
        type: integer
        description: (OPTIONAL) Number of responses per page. By default, it has a value of 25 and must
          be within a range of [25 - 100]
      - name: page
        in: query
        type: integer
        description: (OPTIONAL) Page number
      responses:
        '200':
          description: As a response, we receive the existing performance evaluations.
          schema:
            title: ResponseBody
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              evaluation_processes:
                $ref: '#/definitions/EvaluationProcess'
            description: As a response, we receive all the data related to the available performance evaluations.
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /talent/evaluation_process/{id}/results/capacities:
    get:
      summary: Show the results of the Competency from a performance evaluation
      description: "Displays the results related to the Competency from the queried performance evaluation.\n\
        A result of Competency from a performance evaluation has the following attributes:\n- evaluation_id:\
        \ Unique ID of the performance evaluation\n- evaluation_status: Status of the evaluated employee\n\
        - evaluated_name: Name of the evaluated employee\n- evaluated_rut: RUT of the evaluated employee\n\
        evaluated_document_number: Document Number of the evaluated employee\nevaluated_document_type:\
        \ Type of Document of the evaluated\n- role: Job title of the evaluated employee\n- role_family:\
        \ Job family of the evaluated employee\n- division: Division of the evaluated employee\n- area:\
        \ Area of the evaluated employee\n- sub_area: Sub area of the evaluated employee\n- evaluation_type:\
        \ Type of evaluation\n- evaluator_name: Name of the evaluator\n- evaluator_rut: RUT of the evaluator\n\
        evaluator_document_number: Document Number of the evaluator\nevaluator_document_type: Type of\
        \ Document of the evaluator\n- score_by_capacity: Score per Competency.\n- capacities_score: Competency\
        \ Final score\n- score: Final evaluation score\n\n**Permisos requeridos para utilizar este endpoint:**\
        \ \n* Evaluation permissions en: 'Lectura'.\n"
      tags:
      - Evaluations
      parameters:
      - name: id
        in: path
        type: integer
        description: ID of the performance evaluation to be queried
        required: true
      - name: page_size
        in: query
        type: integer
        description: (Optional) Number of responses per page. By default it has a value of 25 and must
          be within a range of [25 - 100]
      - name: page
        in: query
        type: integer
        description: (OPTIONAL) Page number
      responses:
        '200':
          description: As a response, we received the results related to the Competency of the performance
            evaluation.
          schema:
            title: ResponseBody
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              evaluations:
                $ref: '#/definitions/Capacities'
            description: As a response, we received all the fields corresponding to the information of
              the queried performance evaluation.
        '404':
          description: Performance evaluation not found
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /talent/evaluation_process/{id}/results/goals:
    get:
      summary: Display the results of the Objetivos from a performance evaluation
      description: "Provides results related to the Objetivos from the queried performance evaluation.\n\
        A result of Objetivos from a performance evaluation has the following attributes:\n- evaluation_id:\
        \ Unique ID of the performance evaluation\n- evaluation_status: Status of the evaluated employee\n\
        - evaluated_name: Name of the evaluated employee\n- evaluated_rut: RUT of the evaluated employee\n\
        evaluated_document_number: Document Number of the evaluated employee\nevaluated_document_type:\
        \ Type of Document of the evaluated\n- role: Job title of the evaluated employee\n- role_family:\
        \ Job family of the evaluated employee\n- division: Division of the evaluated employee\n- area:\
        \ Area of the evaluated employee\n- sub_area: Sub area of the evaluated employee\n- evaluation_type:\
        \ Type of evaluation\n- evaluator_name: Name of the evaluator\n- evaluator_rut: RUT of the evaluator\n\
        evaluator_document_number: Document Number of the evaluator\nevaluator_document_type: Type of\
        \ Document of the evaluator\n- score_by_goal: Score by Translation missing: en-br.{custom_translations.models.talent/employee_goal.one\n\
        - goals_score: Final score of Objetivos\n- score: Final evaluation score\n\n**Permisos requeridos\
        \ para utilizar este endpoint:** \n* Evaluation permissions en: 'Lectura'.\n"
      tags:
      - Evaluations
      parameters:
      - name: id
        in: path
        type: integer
        description: ID of the performance evaluation to be queried
        required: true
      - name: page_size
        in: query
        type: integer
        description: (Optional) Number of responses per page. By default it has a value of 25 and must
          be within a range of [25 - 100]
      - name: page
        in: query
        type: integer
        description: (OPTIONAL) Page number
      responses:
        '200':
          description: As a response, we received the results related to the Objetivos of the performance
            evaluation.
          schema:
            title: ResponseBody
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              evaluations:
                $ref: '#/definitions/Goals'
            description: As a response, we received all the fields corresponding to the information of
              the queried performance evaluation.
        '404':
          description: Performance evaluation not found
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
  /training/sence_percents:
    get:
      summary: Mostrar tramo sence de todos los empleados
      description: "Retorna un listado con el id, rut y tramo sence de cada empleados del sistema que\
        \ tenga una liquidación del mes abierto.\n\n**Permisos requeridos para utilizar este endpoint:**\
        \ \n* Permisos de capacitaciones en: 'Lectura' o 'Lectura y Modificación'.\n\n"
      tags:
      - Capacitaciones
      parameters:
      - name: page_size
        in: query
        type: integer
        description: Número de respuestas por página. Por defecto tiene un valor de 25 y debe estar entre
          un rango de [25 - 100]
      responses:
        '200':
          description: Respuesta con el id, rut y porcentaje de tramo sence de cada empleados.
          schema:
            title: ResponseBody
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              data:
                type: array
                items:
                  $ref: '#/definitions/SencePercentIndex'
        '400':
          description: Existe un error con los datos enviados
          schema:
            $ref: '#/definitions/bad_request'
  /training/sence_percents/{employee_id}:
    get:
      summary: Mostrar el tramo sence de un empleados
      description: "Recibimos la información específica del empleados cuya ID o RUT enviamos en la consulta\n\
        \n**Permisos requeridos para utilizar este endpoint:** \n* Permisos de capacitaciones en: 'Lectura'\
        \ o 'Lectura y Modificación'.\n\n"
      tags:
      - Capacitaciones
      parameters:
      - name: employee_id
        in: path
        description: ' ID o RUT sin puntos del empleados a consultar'
        required: true
        type: string
      responses:
        '200':
          description: Retorna el porcentaje de tramo sence del empleados por medio del  ID o RUT.
          schema:
            $ref: '#/definitions/SencePercent'
        '404':
          description: empleados no encontrado
          name: errors
          schema:
            properties:
              errors:
                type: array
                items:
                  type: string
        '400':
          description: Existe un error con los datos enviados
          schema:
            $ref: '#/definitions/bad_request'
  /piecework/tasks:
    get:
      summary: Listar labores
      description: "'Retornar labores desde la fecha de creación dada'\n\n**Permisos requeridos para utilizar\
        \ este endpoint:** \n* Permisos de tratos en: 'Lectura' o 'Lectura y Modificación'.\n\n"
      tags:
      - Labores
      parameters:
      - name: created_at
        description: (OPCIONAL) Fecha en que fue creada la labor en YYYY-MM-DD.
        in: query
        type: string
        format: date
      - name: page_size
        type: integer
        in: query
        description: '(OPCIONAL) Numero de respuestas por página. Por defecto tiene un valor de 25 y debe
          estar entre un rango de [25 - 100]

          '
    post:
      summary: Crear labores
      description: "Crea un nuevo labor en el sistema. Los parámetros son:\n\n  - description : Descripción\
        \ del labor.\n  - code : Código del labor.\n  - seventh_workday : Afecto a semana corrida.\n \
        \ - custom_attrs : Atributos personalizados para labores.\n\n**Permisos requeridos para utilizar\
        \ este endpoint:** \n* Permisos de tratos en: 'Lectura y Modificación'.\n\n"
      tags:
      - Labores
      parameters:
      - name: Labor
        description: Objeto de tipo labor
        in: body
        required: true
        schema:
          properties:
            task:
              $ref: '#/definitions/Piecework::Task::Request'
  /piecework/executions:
    get:
      summary: Listar Tarifas
      description: "'Retornar tarifas desde la fecha de creación dada'\n\n**Permisos requeridos para utilizar\
        \ este endpoint:** \n* Permisos de tratos en: 'Lectura' o 'Lectura y Modificación'.\n\n"
      tags:
      - Tarifas
      parameters:
      - name: created_at
        description: (OPCIONAL) Fecha en que fue creada la tarifa en YYYY-MM-DD.
        in: query
        type: string
        format: date
      - name: page_size
        type: integer
        in: query
        description: '(OPCIONAL) Numero de respuestas por página. Por defecto tiene un valor de 25 y debe
          estar entre un rango de [25 - 100]

          '
    post:
      summary: Crear tarifa
      description: "Crea una nueva tarifa en el sistema. Los parámetros son:\n\n- piecework_place_id :\
        \ Id del lugar.\n- piecework_task_id : Id del labor.\n- piecework_unit_id : Id del unidad.\n-\
