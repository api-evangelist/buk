      - Grupo Familiar
      parameters:
      - name: id
        in: path
        required: true
        description: ID del Grupo Familiar a actualizar
        type: integer
      - name: carga
        in: body
        description: Datos de Grupo Familiar a actualizar
        required: true
        schema:
          type: object
          properties:
            carga:
              type: object
              properties:
                tramo_asignacion:
                  type: string
                carga_simple:
                  type: integer
                carga_maternal:
                  type: integer
                carga_invalida:
                  type: integer
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                detalle_cargas_attributes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      first_name:
                        type: string
                      first_surname:
                        type: string
                      second_surname:
                        type: string
                      relation:
                        type: string
                      birthday:
                        type: string
                        format: date
                      gender:
                        type: string
                      rut:
                        type: string
      responses:
        '200':
          description: Actualización de Grupo Familiar exitosa
          schema:
            type: object
            properties:
              message:
                type: string
                description: Mensaje de confirmación
              carga:
                type: object
                properties:
                  id:
                    type: integer
                  family_allowance_section:
                    type: string
                  simple_family_responsability:
                    type: integer
                  maternity_family_responsability:
                    type: integer
                  invalid_family_responsability:
                    type: integer
                  start_date:
                    type: string
                    format: date
                  end_date:
                    type: string
                    format: date
                  responsability_details:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        first_name:
                          type: string
                        relation:
                          type: string
                        birthday:
                          type: string
                          format: date
        '422':
          description: Error de validación
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
        '404':
          description: Grupo Familiar no encontrado
