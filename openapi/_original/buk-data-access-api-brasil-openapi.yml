        \ - format: Formato en que se encuentra, puede tomar valor electrónica (para leave electrónica)\
        \ o \"física\" (para leave física). - licence_type_id: Id del tipo de leave al que corresponde,\
        \ estas se pueden ver con la operacion GET para \"Listar tipos  leave\".\n- justification: Supplementary\
        \ text for justification of the absence request (optional). - medic_rut: Doctor's RUT (optional).\
        \ - licence_number: Leave number (optional). - medic_name: Doctor's name (optional).\n\nThe Leaves\
