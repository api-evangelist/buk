  /assigns:
    post:
      summary: Asignar un ítem
      description: "No se recomienda el uso de este endpoint para cliente grandes. Para operaciones masivas\
        \ se recomienda usar el endpoint de **Sincronización datos de pago**.\n\nAsigna un nuevo ítem\
        \ a un empleado en el sistema.\n\n  - `employee_id`: Id del empleado al cual se asignará un ítem.\n\
        \  - `item_id`: Id del ítem el cual se asignará al usuario.\n  - `start_date`: Mes de inicio para\
        \ esta asignación.\n  - `end_date`: (opcional) Mes de término para esta asignación.\n  - `description`:\
        \ (opcional) Descripción a mostrar en la liquidación.\n  - `amount`: Monto de la asignación. Requerido\
        \ sólo para ítems de tipo variable.\n  - `advance_payment_day`: (opcional) Día del mes en el que\
        \ se paga el ítem si es de tipo anticipo.\n  - `overwrite_existing_assign`: (opcional) [boolean]\
        \ Indica que se quiere emular el\n    comportamiento del importador masivo. Esto es, permitir\
        \ sobreescribir la asignación en caso de que ya exista.\n  - `cost_center`: (opcional) [string]\
        \ Código de la definición de centro de costos, debe estar habilitada la general Habilitar Centro\
        \ Costo Bonos.\n  - `custom_attrs`: (opcional) [object] Atributos personalizados de la asignación,\
        \ como pares clave-valor.\n\n\n**Permisos requeridos para utilizar este endpoint:** \n* Permisos\
        \ de ítems en: 'Lectura y Modificación'.\n"
