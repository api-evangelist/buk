      summary: Crear una vacacion
      description: "Crea una nueva vacación en el sistema. Los parámetros son:\n\n- employee_id : Id del\
        \ empleado\n- start_date : Fecha de inicio del periodo de vacaciones en formato YYYY-MM-DD\n-\
        \ end_date : Fecha de término del periodo de vacaciones en formato YYYY-MM-DD\n- type: Corresponde\
        \ al tipo de vacaciones, puede ser: legales, progresivas o dias_administrativos (en caso de estar\
        \ activadas).\n- percent_day : Corresponde a la fracción del último día del periodo de vacaciones\
        \ que se considera como tal.\n  Mayor a 0 y menor o igual a 1. Se envía 1 para indicar que el\
        \ último día es completo\n- workday_stage : Indica la parte de la jornada que será parcial si\
        \ es que percent_day es distinto de 1.\n  Puede ser start_working_day si es al inicio de la jornada\
        \ o end_working_day si es al final. Si percent_day\n  es 1, sólo puede ser full_working_day. Este\
        \ campo es opcional. Si no se envía se asignará automáticamente a\n  partir del valor de percent_day\
        \ (full_working_day si es 1 o start_working_day si es menor).\n\n**Permisos requeridos para utilizar\
        \ este endpoint:** \n* Permisos de vacaciones en: 'Lectura y Modificación'.\n\n"
      tags:
