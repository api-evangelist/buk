      description: "Returns the leaves registered in the system in a date range (optional).\nDescription\
        \ of attributes:\n- employee_id: ID of the Colaborador associated with this leave. - start_date:\
        \ Fecha de Inicio*: - days_count: Number of days of duration. - day_percent: Percentage of the\
