      - Items
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/Assign::Create'
      responses:
        '200':
          description: Se devuelve la asignación creada.
          schema:
            properties:
              message:
                type: string
              item:
                $ref: '#/definitions/Assign'
        '400':
          description: Faltan datos que son obligatorios.
        '404':
          description: El empleado `employee_id` o el bono `item_id` no existen.
  /assigns/{id}:
    patch:
      summary: Editar una asignación
      description: "Prefiera el uso del endpoint de **Sincronización datos de pago**\n\nSe modifica una\
        \ Asignación del sistema.\n\nSe debe enviar como JSON un objeto tipo Assign en el cuerpo de la\
        \ petición,\ncompuesto por los siguientes atributos\n\n  - `cost_center`: (opcional) [string]\
        \ Código de la definición de centro de costos, debe estar habilitada la general Habilitar Centro\
        \ Costo Bonos.\n  - `amount`: Monto de la asignación. Requerido solo para ítems de tipo variable\n\
        \  - `custom_attrs`: (opcional) [object] Atributos personalizados de la asignación, como pares\
        \ clave-valor.\n\nLa asignación tiene que ser de un bono variable para poder cambiar el monto.\n\
        \n\n**Permisos requeridos para utilizar este endpoint:** \n* Permisos de ítems en: 'Lectura y\
        \ Modificación'.\n"
      tags:
      - Items
