        \ enfermedad_general, maternidad, licencia_cuidado_hijos - <b>Colombia:</b> remunerada, no_remunerada,\
        \ maternidad_paternidad, luto, calamidad_domestica, suspension, dia_familia\n\n\n\n**Permisos\
