  /employees/{id}/assigns:
    get:
      summary: Show employee's item assignments
      description: "Returns the current assignments of an employee along with basic information of the\
        \ assigned item.\n\nEach assignment consists of:\n- id: unique identifier of the assignment\n\
        - item: item assigned to the employee\n- amount: for items configured with \"different amount\
        \ per person\", this value corresponds to that entered in the assignment, and for items configured\
        \ with \"same amount for all\" this value will be the amount of the item entered at its creation.\
        \ For a formulated item, it represents the value of `item.amount`\n- start_date: start period\
        \ for this assignment\n- end_date: end period for the assignment\n- custom_attrs: the object includes\
        \ a custom attribute with its respective value. If there is no custom attribute configured, this\
        \ will not appear in the response\n\nEach item consists of:\n- id: unique identifier of the item\n\
        - code: item code\n\nThe start date of the period (optional) must be sent as JSON in the body\
        \ of the request.\n\nThe date must be in YYYY-MM-DD format.\n\n\n**Permisos requeridos para utilizar\
        \ este endpoint:** \n* Employee permissions en: 'Lectura'.\n* Item permissions en: 'Lectura'.\n\
        * Allow viewing sensitive information en: 'Sí'.\n"
      tags:
      - Items
      parameters:
      - name: id
        in: path
        description: ID of the employee to be queried
        required: true
        type: string
      - name: date
        in: query
        description: Filter the active added items for this date
        format: date
        type: string
      - name: page_size
        in: query
        type: integer
        description: '(OPTIONAL) Number of answers per page. By default, it has a value of 25 and must
          be within a range of [25 - 100].

          '
      - name: page
        in: query
        type: integer
        description: Page number
      responses:
        '200':
          description: As a response, we receive an array (data) with the information of the added items
          schema:
            properties:
              pagination:
