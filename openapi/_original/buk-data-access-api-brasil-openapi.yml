  /docs/{id}/signatures/process:
    post:
      summary: Start document signature workflow
      tags:
      - Documents
      description: "We receive a document ID, and the signature process begins. If the document had already\
        \ started the signature process, an error with status 409 is displayed.\n\n\n**Permisos requeridos\
        \ para utilizar este endpoint:** \n* Permissions to upload documents en: 'Sí'.\n"
      parameters:
      - name: id
        in: path
        description: Document ID
        required: true
        type: integer
  /docs/{id}/signatures:
    put:
      summary: Add signers to a document
      description: "We receive the signatures or reviewer to be assigned. Changes will only be made to\
        \ parameters that are submitted.\n- In the case of signatures:\n\n  We receive the type of signature\
        \ to assign, this can be a string from the following list:\n  - employee_signature\n  - legal_agent_signature\n\
        \  - second_legal_agent_signature\n  - supervisor_signature\n  - other_signature\n  - second_other_signature\
        \    \n\n  Along with a valid person id with a user. In case of choosing the type of signature\
        \ legal_agent_signature\n  or second_legal_agent_signature, the person ID must be of a legal representative\
        \ configured. If choosing the type of signature employee_signature or supervisor_signature, it's\
        \ not necessary to add the person ID.\n\n  If you want to add an order to the signatures, you\
        \ should add the attribute \"position\" within each signature. Where you must indicate the order\
        \ of the signatures to assign with numerical values from 1 up to the number of signatures, these\
        \ values cannot be repeated. If you do not want an order for the signatures, do not send the \"\
        position\" attribute.\n  \n  To remove the signatures from a document, you must send an empty\
        \ list.\n\n- In the case of the reviewer:\n\n  We receive the person ID of the reviewer. To be\
        \ valid, it must have an active user and at least one active job. To remove a reviewer, you must\
        \ send null in the field.\n\n\n**Permisos requeridos para utilizar este endpoint:** \n* Permissions\
        \ to View and download employee documents en: 'Sí'.\n\nIf you are reassigning a signer to a document\
        \ generated from a template, the template will not be modified. The reassignment will apply only\
        \ to the selected document and it will be reloaded with the current content of the template.\n"
      tags:
      - Documents
      parameters:
      - name: id
        in: path
        description: Document ID
        required: true
        type: integer
      - name: Signature specifications
        in: body
        description: Signature specification object
        required: true
        schema:
          $ref: '#/definitions/Signature'
      responses:
        '201':
          description: As a response we received the information of the signatures and the document reviewer.
          schema:
            properties:
              employee_file_id:
                $ref: '#/definitions/Signature'
        '400':
          description: There is an error with the data submitted
          schema:
            $ref: '#/definitions/bad_request'
