              $ref: '#/definitions/EmployeeFileListDetail'
  /employees/{id}/docs/{file_id}:
    get:
      summary: Obtains an employee document
      description: "The possible file IDs are in the GET `/employees/{id}/docs` endpoint.\n\nThe redirection\
        \ for the entered document of file_id is returned, hence it must be followed.\n\n* To follow the\
        \ redirection, add the ‘-L’ option.\n* To save the response in a file, add the ‘-o’ option and\
        \ pass the file name.\n\n**Example**\n````curl -L -X GET --header 'Accept: */*' --header 'auth_token:\
        \ [AUTH TOKEN]' 'http://www.[COMPANY SUBDOMAIN].buk.cl/api/v1/employees/1/docs/1156' -o [FILE\
        \ NAME]````\n\nTest with ‘curl’, the Try It button does not work for documents.\n\n\n**Permisos\
        \ requeridos para utilizar este endpoint:** \n* Permissions to View and download employee documents\
        \ en: 'Sí'.\n"
