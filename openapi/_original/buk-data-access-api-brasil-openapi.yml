  /jobs/{id}/terminate:
    patch:
      summary: Complete the job with the given ID.
      description: "\nTerminates the job with the given id. Requires end date and termination reason (unless\
        \ it is a contract for services). The parameters are:\n- end_date: End date of the job.\n- termination_reason:\
        \ Reason for job termination. Accepted reasons are:\n\n\"Chile: [\"mutuo_acuerdo\", \"renuncia\"\
        , \"muerte\", \"vencimiento_plazo\", \"fin_servicio\", \"caso_fortuito\", \"falta_probidad\",\
        \ \"acoso_sexual\", \"vias_de_hecho\", \"injurias\", \"conducta_inmoral\", \"acoso_laboral\",\
        \ \"negociaciones_prohibidas\", \"no_concurrencia\", \"abandonar_trabajo\", \"faltas_seguridad\"\
        , \"perjuicio_material\", \"incumplimiento\", \"necesidades_empresa\", \"desahucio_gerente\"]\"\
        \n\n\"Peru: [\"renuncia\", \"renuncia_con_incentivos\", \"despido\", \"cese_colectivo\", \"jubilacion\"\
        , \"invalidez_absoluta_permanente\", \"terminacion_de_la_obra\", \"mutuo_disenso\", \"fallecimiento\"\
        , \"sucesion_en_posicion_empleador\", \"extincion_o_liquidacion_empleador\", \"no_se_inicio_relacion_laboral\"\
        , \"limite_edad\", \"injustificado\"]\"\n\n\"Mexico: [\"renuncia_voluntaria\", \"muerte\", \"\
        causa_imputable_patron\", \"despido_injustificado\", \"despido_justificado\", \"terminacion_natural\"\
        , \"incapacidad_permanente\", \"invalidez_trabajador\", \"reajuste_maquina\", \"clausura\", \"\
        abandono_empleo\", \"ausentismo\", \"jubilacion\", \"otras\"]\"\n\n\"Colombia: [\"renuncia_voluntaria\"\
        , \"causa_justa_empleador\", \"termino_mutuo_acuerdo\", \"vencimiento_plazo\", \"termino_obra\"\
        , \"termino_sentencia\", \"muerte\", \"termino_abandono\", \"sustitucion_patronal\", \"abandono_cargo\"\
        , \"decision_unilateral\"]\"\n\n- comment: Internal comment on the job termination (OPTIONAL)\n\
        - employee_final_state: Final status of Colaborador, by default remains inactive: [\"pending\"\
        , \"inactive\"] (OPTIONAL)\n- notice_date: Notice date of job termination in YYYY-MM-DD format;\
        \ if this field is not added, end_date will be considered. (OPTIONAL)\n\n**Permisos requeridos\
        \ para utilizar este endpoint:** \n* Employee permissions en: 'Lectura y Modificación'.\n"
      tags:
