    get:
      summary: Show Worked Days
      description: "Provides information about the days worked for each Colaborador.\n\nA type of Worked\
        \ Day has the following attributes:\n- employee_id: unique identifier of the Colaborador\n- document_number:\
        \ Document Number of the Colaborador\n- document_type: Type of Document of the Colaborador\n-\
        \ code: file code of the Colaborador\n- working_days: total number of days worked\n- working_days_dates:\
