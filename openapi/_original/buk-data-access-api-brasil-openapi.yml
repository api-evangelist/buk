        format: date
        description: (OPTIONAL) Indicates the starting date of the worked days (Format YYYYY-MM-DD)
      - name: to
        in: query
        type: string
        format: date
        description: (OPTIONAL) Indicates the end date of the worked days (Format YYYYY-MM-DD)
      - name: document_number
        in: query
        type: string
        description: (OPTIONAL) Document Number of the Colaborador
      - name: code
        in: query
        type: string
        description: (OPTIONAL) Colaborador file code
      - name: page_size
        in: query
        type: integer
        description: (OPTIONAL) Number of answers per page. By default it has a value of 25 and must be
          within a range of [25 - 100].
      - name: page
        in: query
        type: integer
        description: (OPTIONAL) Page number
      responses:
        '200':
          description: A list of days worked for each Colaborador.
          schema:
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              data:
                type: array
                items:
                  $ref: '#/definitions/WorkingDay'
    post:
      summary: Create worked days
      description: "Save worked days for each Colaborador. The parameters are:\n\n- employee_id: ID of\
        \ the Colaborador\n- month: Number of the month to which the worked days will be added\n- working_days:\
        \ a list of worked days for the indicated month. This list should be a sequence of integers, where\
        \ each number represents a day of the month, separated by commas.\n\nPlease note that the worked\
        \ days will be saved for the specified month, overwriting the existing entry. In other words,\
        \ each request will overwrite the worked days.\n\nPlease note that if the employee's pay stub\
        \ is closed for that month, worked days cannot be added.\n\nPlease note that worked days can only\
        \ be added in open months.\n\n**Permisos requeridos para utilizar este endpoint:** \n* Attendance\
        \ permissions en: 'Lectura y Modificación'.\n"
      tags:
      - Days worked
      parameters:
      - name: WorkingDay
        description: Object of type WorkingDay
        in: body
        schema:
          $ref: '#/definitions/WorkingDay::Minimal'
      responses:
        '201':
          description: Response in case of successful creation of worked days
          schema:
            properties:
              message:
                type: string
