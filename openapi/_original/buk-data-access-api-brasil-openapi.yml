      - Ítems
      parameters:
      - name: date
        in: query
        type: string
        format: date
        description: Filtra los ítems que son vigentes para esta fecha
      - name: name
        in: query
        type: string
        description: Filtra los ítems con este nombre
      - name: code
        in: query
        type: string
        description: Filtra los ítems con este código
      - name: type
        in: query
        type: string
        description: Filtra los ítems del tipo especificado ('haber', 'descuento', 'anticipo', 'aporte',
          'informativo')
      - name: page_size
        in: query
        type: integer
        description: (OPCIONAL) Numero de respuestas por página. Por defecto tiene un valor de 25 y debe
          estar entre un rango de [25 - 100]
      responses:
        '200':
          description: Como respuesta recibimos un arreglo (data) con la información de los ítems
