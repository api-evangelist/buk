  /employees/{employee_id}/payment_data/{period_id}:
    post:
      summary: Crea o actualiza las asignaciones y sobretiempos de un determinado Colaborador.
      description: "Se guardarán los datos enviados solo si ningún objeto presenta errores.\nDe lo contrario,\
        \ se retornarán los objetos que posean uno o más errores.\nEn el caso de que el objeto ya exista\
        \ previamente, este será actualizado con los datos enviados.\n\nEach assignment is composed of\n\
        - id: ID of the Added Item to be deleted (optional)\n- _destroy: boolean (optional) (in order\
        \ to delete a Added Item there must be id and _destroy in the object in question)\n- item_id:\
        \ item assigned to Colaborador\n- amount: for items configured with amount \"different per person\"\
        , this value corresponds to the one entered\n  in the assignment and for items configured with\
        \ amount \"equal for all\" this value will be the amount of the\n  item entered in its creation.\
        \ For a formulated item, it represents the value of `item.monto`\n- end_date: end period for the\
        \ assignment. If not sent, the assignment will be considered in force indefinitely\n- custom_attrs:\
        \ object with custom attribute and value\n\n\nEach overtime consists of:\n- day: Día el cual se\
        \ realizó las horas extras (opcional)\n- month: The month corresponding to overtime\n- year: The\
        \ year the overtime corresponds to\n- hours: Number of overtime hours to add\n- employee_id: ID\
        \ of the Colaborador to whom to associate overtime.\n- type_id: ID of the type of overtime to\
        \ add\n- centro_costo: Cost center code to which the overtime will be charged\n\n**Permisos requeridos\
        \ para utilizar este endpoint:** \n* Employee permissions en: 'Lectura'.\n* Item permissions en:\
        \ 'Lectura y Modificación'.\n* Attendance permissions en: 'Lectura y Modificación'.\n"
      tags:
      - Synchronization of payment data
      parameters:
      - name: employee_id
        in: path
        type: integer
        required: true
      - name: period_id
        in: path
        type: integer
        required: true
      - name: body
        description: Objeto con asignaciones y sobretiempos.
        in: body
        schema:
          properties:
            overtimes:
              type: array
              items:
                $ref: '#/definitions/Attendances::Overtime::PaymentDetail'
            assigns:
              type: array
              items:
                $ref: '#/definitions/Assign::PaymentDetail'
      responses:
        '200':
          description: Se devuelve data con asignaciones y sobretiempos creados.
          schema:
            properties:
              data:
                properties:
                  assigns:
                    type: array
                    items:
                      $ref: '#/definitions/Assign::PaymentDetailResponse'
                  overtimes:
                    type: array
                    items:
                      $ref: '#/definitions/Attendances::Overtime::PaymentDetail'
        '404':
          description: El Colaborador 'employee_id' no existen.
  /people/{id}:
