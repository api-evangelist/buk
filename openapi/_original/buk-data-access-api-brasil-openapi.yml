  /benefits/benefit_requests:
    get:
      summary: List all benefit requests
      description: "This endpoint returns all benefit requests.\n\n\n**Permisos requeridos para utilizar\
        \ este endpoint:** \n* Benefit permissions en: 'Lectura'.\n"
      tags:
      - Benefits
      parameters:
      - name: status
        in: query
        description: '(OPTIONAL) Request status. Allowed values: in_process, approved, rejected, pre_approved,
          incomplete, cancel_request, canceled'
        required: false
        type: string
      - name: person_id
        in: query
        description: (OPTIONAL) ID of the person who requested the benefit. Used to filter requests from
          a specific person.
        required: false
        type: integer
      - name: available_version_id
        in: query
        description: (OPTIONAL) ID of the specific version of the requested benefit.
        required: false
        type: integer
      - name: requested_at_from
        in: query
        description: '(OPTIONAL) Date from which to filter requests (format: YYYY-MM-DD). Allows searching
          for requests made from a specific date onwards'
        required: false
        type: string
        format: date
      - name: requested_at_to
        in: query
        description: '(OPTIONAL) Date up to which to filter requests (format: YYYY-MM-DD). Allows searching
          for requests made up to a specific date'
        required: false
        type: string
        format: date
      - name: page
        in: query
        description: (OPTIONAL) Page number for result pagination. Defaults to 1 if not specified
        required: false
        type: integer
        default: 1
      - name: per_page
        in: query
        description: (OPTIONAL) Number of records per page (maximum 100). Default is 25 if not specified
        required: false
        type: integer
        default: 25
      - name: sort_by
        in: query
        description: '(OPTIONAL) Field by which to sort the results. Allowed values: id, person_id, approver_id,
          available_version_id, status, points_cost, requested_at, status_date, created_at'
        required: false
        type: string
        default: id
      - name: sort_order
        in: query
        description: '(OPTIONAL) Sort direction. Allowed values: asc (ascending), desc (descending). Default
          is desc'
        required: false
        type: string
        enum:
        - asc
        - desc
        default: desc
      responses:
        '200':
          description: Benefit requests list
          schema:
            properties:
              pagination:
                $ref: '#/definitions/Pagination'
              data:
                type: array
                items:
                  $ref: '#/definitions/BenefitRequestResponse'
  /benefits/benefit_requests/{id}:
    get:
