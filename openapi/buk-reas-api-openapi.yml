        type: string
      address:
        type: string
      children_area:
        type: array
        items:
          $ref: '#/definitions/parent_child_area'
      parent_area:
        $ref: '#/definitions/parent_child_area'
      first_level_id:
        type: integer
      first_level_name:
        type: string
      second_level_id:
        type: integer
      second_level_name:
        type: string
      depth:
        type: integer
      cost_center:
        type: string
      status:
        type: string
      custom_attributes:
        type: object
securityDefinitions:
  auth_token:
    type: apiKey
    name: auth_token
    in: header
