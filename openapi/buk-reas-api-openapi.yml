      location_id:
        required: true
        type: integer
      active:
        type: boolean
      role_ids:
        type: array
        items:
          type: integer
      custom_attrs:
        type: object
        items:
          type: string
  AreaSecondLevel:
    properties:
      id:
        type: integer
      name:
        type: string
      division:
        $ref: '#/definitions/AreaFirstLevel'
  Pagination:
    properties:
      next:
        type: string
      previous:
        type: string
      count:
        type: integer
      total_pages:
        type: integer
  Area:
    properties:
      id:
        type: integer
      name:
        type: string
      address:
        type: string
      children_area:
        $ref: '#/definitions/parent_child_area'
      parent_area:
        $ref: '#/definitions/parent_child_area'
      cost_center:
        type: string
      department:
        $ref: '#/definitions/AreaSecondLevel'
      status:
        type: string
      custom_attributes:
        type: object
  Area_new:
    properties:
      id:
        type: integer
