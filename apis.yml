apis:
- aid: buk:data-access-api
  name: Buk Data Access API
  description: >-
    The Buk platform API — a tenant-scoped REST interface over the HR and payroll system of
    record. 151 paths and 206 operations across 40 tag groups covering employees
    (Colaboradores), jobs, people, companies, areas and sub-areas, roles, cost centres, unions,
    work locations, payroll periods and processes, settlements (liquidaciones), payslips,
    vacations, absences, medical leave, permissions, unworked and overtime hours, benefits,
    salary advances and credits, accounting centralisation and accounting structures, items,
    KPIs, labour suspensions, evaluations, substitutions, applicants and applications. Published
    as a Swagger 2.0 contract served unauthenticated from every customer tenant in five country
    variants (Chile, Colombia, Peru, Mexico, Brazil) and three languages (es, en, pt); the five
    variants share identical paths and operations and differ only in their country-specific
    definition sets. Authentication is an API key in an auth_token header, issued per tenant and
    scoped per entity to read or read-and-modify.
  humanURL: https://demo.buk.cl/apidocs
  baseURL: https://demo.buk.cl/api/v1/chile
  tags:
