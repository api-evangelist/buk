- aid: buk:attendance-biometrics-api
  name: Buk Attendance — Biometric Integration API
  description: >-
    A public, vendor-agnostic clocking ingestion API for biometric devices from any
    manufacturer. A single POST /v1/clockings operation that any device middleware can consume
    after normalising its data to Buk's generic format, so Buk Asistencia never needs to know
    the originating manufacturer. Published as an OpenAPI 3.0.3 contract on SwaggerHub;
    authenticated by a provider header pair (x-provider-name plus x-provider-token).
  humanURL: https://app.swaggerhub.com/apis-docs/BUKASISTENCIA/AttendanceBiometrics/1.0.0
  baseURL: https://zktc.prod.asis.buk.cl/rest
  tags:
  - Time and Attendance
  - Biometrics
  - Device Integration
  - Latin America
  properties:
