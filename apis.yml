aid: buk
name: Buk
url: https://raw.githubusercontent.com/api-evangelist/buk/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
description: >-
  Buk (Buk SpA, Santiago, Chile) is a Latin American HR and payroll platform — "software de
  gestión de personas" — covering payroll and settlement calculation, employee records,
  contracts and digital signature, time and attendance, absence and vacation management,
  benefits and salary advances, recruitment, onboarding, training and performance. Founded in
  2017 and bootstrapped for its first five years, it raised a $50M Series A led by Greenoaks
  and SoftBank in 2021 and a further $50M Series B in 2024, and now operates country editions
  for Chile, Peru, Mexico, Colombia and Brazil. Its API posture is unusual for the region and
  unusually good in one specific way: every customer tenant serves a complete, unauthenticated,
  machine-readable Swagger 2.0 contract for the Buk Data Access API at
  https://{tenant}.buk.cl/api/{country}/{language}/api_docs — 151 paths and 206 operations,
  in five country variants and three languages — behind a Swagger UI at /apidocs, alongside a
  documented webhook catalog. Two further contracts for Buk Asistencia (attendance) and its
  vendor-agnostic biometric clocking ingestion endpoint are published publicly on SwaggerHub
  under the BUKASISTENCIA account. What is missing is the developer-program scaffolding around
  those contracts: there is no developer portal, no first-party SDK, no CLI, no Postman
  workspace, no status page, no sandbox, no /.well-known/ surface, no MCP server, no
  operationId on any of 206 operations, and no documented rate limit or 429 response. The
  contract is public; the program around it is not built yet.
image: https://www.buk.cl/hubfs/logo-buk.svg
tags:
- Human Resources
- Payroll
- HR Tech
- Time and Attendance
- Benefits
- Recruiting
- Performance Management
- Employee Records
- Latin America
- Chile
- SaaS
- Webhooks
