- aid: buk:asistencia-api
  name: Buk Asistencia API
  description: >-
    The API for Buk Asistencia, Buk's time-and-attendance product, published as an OpenAPI 3.0.0
    contract on SwaggerHub under the BUKASISTENCIA account. Ten operations across seven tag
    groups: paginated listings of work sites (recintos), the collaborator roster, shift
    assignments, absences, overtime and unworked hours, plus reading and injecting attendance
    clocking records. Authentication is an API key in a token header, requested from the Buk
    SAC team.
  humanURL: https://app.swaggerhub.com/apis-docs/BUKASISTENCIA/ApiAsistencia/1.0.0
